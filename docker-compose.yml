services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/monitor.db
    restart: unless-stopped

  watchdog:
    build: ./backend
    command: ["python", "-m", "app.watchdog"]
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/monitor.db
      - WATCHDOG_URL=http://backend:8000/health
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /changenotifier-api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
